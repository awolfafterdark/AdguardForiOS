name: Ad Getr3kt unsigned IPA
on:
  workflow_dispatch:
    inputs:
      app_name:
        description: Home Screen name (requires reinstall to change)
        default: aWolfAfterDar’s Ad Getr3kt
        type: string
      configuration:
        description: Debug includes upstream diagnostics; Release is optimized
        default: Release
        type: choice
        options: [Release, Debug]
  push:
    branches: [codex/internal-unsigned]
permissions:
  contents: read
concurrency:
  group: unsigned-ipa-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: macos-26-intel
    timeout-minutes: 180
    env:
      APP_NAME: ${{ inputs.app_name || 'aWolfAfterDar’s Ad Getr3kt' }}
      CONFIGURATION: ${{ inputs.configuration || 'Release' }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.6'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install build tools
        run: |
          set -euo pipefail
          mkdir -p out
          exec > >(tee out/setup.log) 2>&1
          npm install --global yarn@1.22.22
          python -m pip install 'conan==2.24.0' 'cmake==3.31.10' ninja 'Pillow==11.3.0'
          brew install autoconf automake libtool pkg-config nasm
          conan profile detect --force
          xcodebuild -version
      - name: Restore public DNS source build
        uses: actions/cache/restore@v4
        id: dns-cache
        with:
          path: .internal/AGDnsProxy.xcframework
          key: dns-2.10.1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('ci/build-dns.sh') }}
      - name: Test shared App Group resolution
        shell: bash
        run: |
          set -euo pipefail
          clang -fobjc-arc -fblocks -framework Foundation ci/test-app-groups.m -o "$RUNNER_TEMP/test-app-groups"
          "$RUNNER_TEMP/test-app-groups" 2>&1 | tee out/app-groups-test.log
      - name: Build public DNS framework
        if: steps.dns-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          bash ci/build-dns.sh 2>&1 | tee out/dns-build.log
      - name: Save completed DNS framework
        if: steps.dns-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .internal/AGDnsProxy.xcframework
          key: ${{ steps.dns-cache.outputs.cache-primary-key }}
      - name: Prepare unsigned project
        run: python ci/prepare.py
      - name: Build app and all embedded extensions
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          xcodebuild -resolvePackageDependencies -workspace AdguardSafariExtension-iOS.xcworkspace -scheme AdguardPro 2>&1 | tee out/resolve.log
          xcodebuild build \
            -workspace AdguardSafariExtension-iOS.xcworkspace \
            -scheme AdguardPro -configuration "$CONFIGURATION" \
            -destination 'generic/platform=iOS' -derivedDataPath "$PWD/.derived" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY= \
            DEVELOPMENT_TEAM= PROVISIONING_PROFILE_SPECIFIER= \
            ENABLE_USER_SCRIPT_SANDBOXING=NO 2>&1 | tee out/build.log
      - name: Package and validate unsigned IPA
        run: python ci/package.py
      - name: Upload IPA and signing reference
        uses: actions/upload-artifact@v4
        with:
          name: Ad-Getr3kt-unsigned-${{ github.run_number }}
          path: |
            out/*.ipa
            out/*.sha256
            out/signing-reference.json
          if-no-files-found: error
      - name: Upload diagnostic logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs-${{ github.run_number }}
          path: out/*.log
          if-no-files-found: ignore
